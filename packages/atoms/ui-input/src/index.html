<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Input – Estados</title>

  </head>

  <body>
    <h1>UI Input – Estados</h1>

    <div class="demo">
      <!-- DEFAULT -->
      <h2>Default</h2>
      <ui-input
        label="Usuario"
        placeholder="Escribe tu usuario"
        inputId="user-default"
        name="user"
      ></ui-input>

      <!-- HOVER / ACTIVE -->
      <h2>Hover / Active (interactúa)</h2>
      <ui-input
        label="Nombre"
        placeholder="Pasa el mouse y escribe"
        inputId="user-hover"
      ></ui-input>

      <!-- FILLED -->
      <h2>Filled</h2>
      <ui-input
        label="Correo"
        value="correo@ejemplo.com"
        inputId="user-filled"
      ></ui-input>

      <!-- FILLED + HOVER -->
      <h2>Filled + Hover</h2>
      <ui-input
        label="Ciudad"
        value="Pasto"
        inputId="user-filled-hover"
      ></ui-input>

      <!-- ERROR + DEFAULT -->
      <h2>Error + Default</h2>
      <ui-input
        label="Documento"
        error="Campo obligatorio"
        inputId="user-error"
      ></ui-input>

      <!-- ERROR + HOVER / ACTIVE -->
      <h2>Error + Active</h2>
      <ui-input
        label="Correo"
        placeholder="correo@"
        error="Formato inválido"
        inputId="user-error-active"
      ></ui-input>

      <!-- ERROR + FILLED -->
      <h2>Error + Filled</h2>
      <ui-input
        label="Correo"
        value="correo@"
        error="Formato inválido"
        inputId="user-error-filled"
      ></ui-input>

      <!-- DISABLED -->
      <h2>Disabled</h2>
      <ui-input
        label="Teléfono"
        placeholder="No editable"
        disabled
        inputId="user-disabled"
      ></ui-input>

      <!-- READ ONLY -->
      <h2>Read Only</h2>
      <ui-input
        label="Código"
        value="ABC-123"
        readonly
        inputId="user-readonly"
      ></ui-input>

      <!-- REQUIRED -->
      <h2>Required</h2>
      <ui-input
        label="Nombre completo"
        placeholder="Campo obligatorio"
        required
        inputId="user-required"
      ></ui-input>
    </div>

    <!-- CARGA DEL WEB COMPONENT -->
    <script type="module" src="/build/ui-input.esm.js"></script>
    <script nomodule src="/build/ui-input.js"></script>

    <!-- EVENTO valueChange -->
    <script>
      document.querySelectorAll("ui-input").forEach((input) => {
        input.addEventListener("valueChange", (e) => {
          console.log("Evento valueChange:", e.detail);
          if (e.detail?.value !== undefined) {
            console.log("Valor:", e.detail.value);
          }
        });
      });
    </script>
  </body>
</html>
