<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Panel Modal</title>
  </head>
  <body>
    <h1>UI Panel Modal</h1>

    <ui-panel-modal open="true" title="Agregar Transacción">
      <form>
        <div class="form-group">
          <label>Concepto</label>
          <input type="text" />
        </div>

        <div class="form-group">
          <label>Movimiento</label>
          <select>
            <option>Seleccione</option>
          </select>
        </div>

        <div class="form-group">
          <label>Valor</label>
          <input type="number" value="0" />
        </div>

        <div class="form-group">
          <label>Método de Pago</label>
          <select>
            <option>Seleccione</option>
          </select>
        </div>

        <div class="form-group">
          <label>Relación</label>
          <select>
            <option>Seleccione</option>
          </select>
        </div>

        <div class="timestamp">2025-03-28T14:14:44.033Z</div>

        <div class="form-group">
          <label>Fecha</label>
          <input type="datetime-local" value="2025-03-28T02:14" />
        </div>
      </form>

      <div slot="footer" class="footer">
        <button class="cancel">Cancelar</button>
        <button class="guardar">Guardar</button>
      </div>
    </ui-panel-modal>

    <script type="module" src="/build/ui-panel-modal.esm.js"></script>
    <script nomodule src="/build/ui-panel-modal.js"></script>
  </body>
</html>
